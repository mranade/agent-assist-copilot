[project]
name = "agent-assist-copilot"
version = "0.2.0"
description = "Real-time agent assist for contact centers: speech-to-text, grounded KB suggestions from a LangGraph agent, and call summaries."
requires-python = ">=3.10"
dependencies = [
    "scikit-learn>=1.3",
    "snowballstemmer>=2.2",
    "vaderSentiment>=3.3",
    "langgraph>=0.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
speech = ["faster-whisper>=1.0"]
llm = ["anthropic>=0.40"]
dev = ["pytest>=7.0", "httpx>=0.27"]
voices = ["piper-tts>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
